<blockquote>
<p>打在繩端的止索結，防止繩子從滑輪、孔洞或手中滑脫。</p>
</blockquote>
<p class="src">來源：raw/10_八字結.txt（童軍團長自編教學筆記）</p>

<h2>用途</h2>
<ul>
<li>止索結：防止繩子從滑輪、孔洞或手中滑脫</li>
<li>攀岩常用「八字結繩圈」的基礎</li>
</ul>

<li>再穿過形成的圈（結形像數字 <strong>8</strong>）</li>
<li>拉緊</li>
