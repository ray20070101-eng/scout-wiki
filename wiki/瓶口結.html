<blockquote>
<p>繫住有瓶唇的瓶子或罐子方便提著走，露營時常用來提水瓶。</p>
</blockquote>
<p class="src">來源：raw/11_瓶口結.txt</p>

<h2>用途</h2>
<p>繫住有瓶唇的瓶子或有邊緣的罐子，方便攜帶（露營提水瓶）。</p>
<h2>打法重點</h2>
<ol>
<li>先做出結形</li>
<li>套進瓶口拉緊，讓繩子卡在<strong>瓶唇下方</strong></li>
<li>兩端繩頭可打結做成提把</li>
</ol>
