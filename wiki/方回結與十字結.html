<main><h1>方回結與十字結（綁紮）</h1>
<blockquote>
<p>把兩根竿子綁在一起的綁紮法：十字交叉用方回結，斜交會滑開用十字結。</p>
</blockquote>
<p class="src">來源：raw/14_方回結與十字結.txt（童軍團長自編教學筆記）</p>

<h2>方回結</h2>
<p>用途：兩根竿子<strong>十字交叉</strong>綁緊，搭營門、架子、置物架。</p>
<ol>
<li>以 <a href="雙套結.html">雙套結</a> 起頭</li>
<li>沿兩竿繞「井」字形 3～4 圈</li>
<li>在兩竿之間纏緊 2～3 圈（勒緊）</li>
<li>以 <a href="雙套結.html">雙套結</a> 收尾</li>
</ol>
<h2>十字結（斜綁）</h2>
<p>用途：兩根竿子<strong>斜交</strong>、會互相滑開時使用。</p>
<ul>
<li>以 <a href="繫木結.html">繫木結</a> 起頭</li>
<li>來源未提供後續步驟，不自行補充。</li>
</ul>
