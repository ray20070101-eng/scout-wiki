<main><h1>平結</h1>
<blockquote>
<p>結形扁平，用來捆紮、連接粗細相同的繩子、綁三角巾，是急救包紮最常用的結。</p>
</blockquote>
<p class="src">來源：raw/05_平結.txt</p>

<h2>用途</h2>
<ul>
<li>捆紮或包裹物件</li>
<li>連接兩條<strong>粗細相同</strong>的繩子</li>
<li>綁三角巾與繃帶：結形扁平，不會頂到傷患</li>
</ul>
<h2>打法</h2>
<p>口訣：<strong>右壓左、左壓右</strong></p>
<ol>
<li>兩繩頭交叉，右壓左繞一次</li>
<li>再左壓右繞一次</li>
<li>拉緊</li>
</ol>
<h2>常見錯誤</h2>
<p>兩次都用同一方向壓 → 變成容易鬆脫的「<strong>祖母結</strong>」。</p>
<h2>⚠️ 注意</h2>
<p>兩條繩子粗細不同時平結容易滑脫，<strong>不能用來承重或接長繩</strong>，應改用 <a href="接繩結.html">接繩結</a>。</p>
