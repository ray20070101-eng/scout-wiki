<main><h1>雙套結</h1>
<blockquote>
<p>把繩子繫在木樁、營柱、欄杆上的結，也是許多綁紮工作的起頭結。</p>
</blockquote>
<p class="src">來源：raw/06_雙套結.txt</p>

<h2>用途</h2>
<ul>
<li>把繩子繫在木樁、營柱、欄杆或另一條繩上</li>
<li>綁紮的起頭結：<a href="方回結與十字結.html">方回結與十字結</a> 中的方回結就以雙套結<strong>開始與結束</strong></li>
</ul>
<h2>打法（繞柱法）</h2>
<ol>
<li>繩頭繞柱一圈，壓過繩身</li>
<li>再繞柱第二圈</li>
<li>繩頭從第二圈底下穿出，兩圈呈交叉的 <strong>X 形</strong></li>
<li>拉緊</li>
</ol>
<h2>⚠️ 注意</h2>
<p>兩邊受力不平均或被反覆轉動時可能鬆脫；重要用途可在末端<strong>加打半結</strong>固定。</p>
