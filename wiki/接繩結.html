<main><h1>接繩結</h1>
<blockquote>
<p>把兩條粗細或材質不同的繩子接在一起，比平結牢靠。</p>
</blockquote>
<p class="src">來源：raw/09_接繩結.txt（童軍團長自編教學筆記）</p>

<h2>用途</h2>
<p>連接粗細不同或材質不同的兩條繩子（<a href="平結.html">平結</a> 在這種情況會滑脫）。</p>
<h2>打法</h2>
<ol>
<li>粗繩對折成<strong>繩耳</strong></li>
<li>細繩由下往上穿過繩耳</li>
<li>繞到繩耳後方一圈</li>
<li>從自己的繩身底下穿過（<strong>不要</strong>穿過繩耳）</li>
<li>拉緊</li>
</ol>
<h2>加強版</h2>
<p>細繩多繞一圈再穿過 → 更牢的「<strong>雙接繩結</strong>」。</p>
